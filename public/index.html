<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>works — agent workspaces</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
<style>
  :root {
    --bg: #0b0e14;
    --bg2: #11151f;
    --panel: #151a26;
    --panel2: #1a2130;
    --border: #232b3b;
    --text: #c8d0e0;
    --muted: #6b7688;
    --accent: #4f8cff;
    --accent2: #7aa7ff;
    --green: #3ecf8e;
    --red: #ff5c5c;
    --yellow: #f5b83d;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    display: flex;
    overflow: hidden;
  }

  /* sidebar */
  #sidebar {
    width: 300px;
    min-width: 300px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
  #brand {
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .5px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--bg2), var(--panel));
  }
  #brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 0 8px var(--accent);
  }
  #brand .name { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #brand .sub { color: var(--muted); font-size: 10px; font-weight: 400; margin-left: auto; }

  #new-form {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    display: grid;
    gap: 8px;
  }
  #new-form input, #new-form select {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 7px 9px;
    font: inherit;
    outline: none;
  }
  #new-form input:focus, #new-form select:focus { border-color: var(--accent); }
  #new-form button {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 8px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: filter .15s;
  }
  #new-form button:hover { filter: brightness(1.1); }
  #new-form .row { display: grid; grid-template-columns: 1fr 110px; gap: 8px; }
  #ws-list { flex: 1; overflow-y: auto; padding: 6px; }
  .ws {
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background .12s;
  }
  .ws:hover { background: var(--panel); }
  .ws.active { background: var(--panel2); border-color: var(--border); }
  .ws .top { display: flex; align-items: center; gap: 8px; }
  .ws .status { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .ws .status.run { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .ws .status.stopped { background: var(--muted); }
  .ws .id { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ws .meta { margin-top: 3px; color: var(--muted); font-size: 11px; display: flex; gap: 10px; flex-wrap: wrap; }
  .ws .task { color: var(--text); }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; }

  /* main */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
  }
  #toolbar .ws-id { font-weight: 700; }
  #toolbar .muted { color: var(--muted); }
  #toolbar .spacer { flex: 1; }
  .btn {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 12px;
    font: inherit;
    cursor: pointer;
    transition: all .12s;
  }
  .btn:hover { border-color: var(--accent); color: #fff; }
  .btn.green { border-color: var(--green); color: var(--green); }
  .btn.green:hover { background: var(--green); color: #04120b; }
  .btn.red { border-color: var(--red); color: var(--red); }
  .btn.red:hover { background: var(--red); color: #fff; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: .4; cursor: default; }

  #tabs { display: flex; gap: 4px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--bg2); }
  .tab {
    padding: 9px 14px;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-weight: 500;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  #views { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; display: none; }
  .view.active { display: block; }
  #terminal-view { padding: 0; background: #000; }
  #terminal { height: 100%; padding: 8px; }
  #terminal .xterm { height: 100%; }
  #diff-view { overflow: auto; padding: 0; }
  #diff-header {
    display: flex; gap: 10px; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--muted);
  }
  #diff-header .stat { color: var(--text); flex: 1; }
  #diff-content { padding: 14px; white-space: pre-wrap; font-size: 12.5px; line-height: 1.5; }
  .diff-line { display: flex; gap: 8px; padding: 0 8px; border-radius: 3px; }
  .diff-line .ln { color: var(--muted); user-select: none; min-width: 3em; text-align: right; }
  .diff-line.add { background: rgba(62, 207, 142, .12); color: #9be8c4; }
  .diff-line.del { background: rgba(255, 92, 92, .12); color: #f0a8a8; }
  .diff-line.hunk { color: var(--accent); margin-top: 8px; }
  .diff-line.meta { color: var(--yellow); font-weight: 600; }
  .diff-line.clean { color: var(--muted); padding: 20px; }
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 8px; transition: transform .2s; z-index: 10;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #commit-bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--border); background: var(--bg2); }
  #commit-bar input { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 6px 9px; font: inherit; outline: none; }
  #commit-bar input:focus { border-color: var(--accent); }

  /* file tree + code view */
  #tree-view { display: none; }
  #tree-view.active { display: flex; flex-direction: column; }
  #tree-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid var(--border); }
  #tree-content { flex: 1; overflow: auto; padding: 8px; }
  .tree-item { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .tree-item:hover { background: var(--panel); }
  #code-content { flex: 1; overflow: auto; margin: 0; padding: 14px; font-size: 12.5px; line-height: 1.5; color: var(--text); white-space: pre; }

  /* access gate */
  #gate {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
  }
  .gate-card {
    width: 320px; padding: 32px; border-radius: var(--radius);
    background: var(--panel); border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
  }
  .gate-logo { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; }
  .gate-logo .name { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .gate-sub { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
  #gate-form { display: flex; flex-direction: column; gap: 10px; }
  #gate-form input {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 9px 11px; font: inherit; outline: none;
  }
  #gate-form input:focus { border-color: var(--accent); }
  #gate-form button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 9px; font: inherit; font-weight: 600; cursor: pointer;
  }
  #gate-form button:hover { filter: brightness(1.1); }
  .gate-error { color: var(--red); font-size: 12px; display: none; }
  .tree-item .arrow { width: 12px; color: var(--muted); }
  .tree-item .icon { width: 14px; color: var(--muted); }

  #code-header { padding: 8px 14px; border-bottom: 1px solid var(--border); color: var(--muted); }
  #code-content { flex: 1; overflow: auto; margin: 0; padding: 14px; font-size: 12.5px; line-height: 1.5; color: var(--text); white-space: pre; }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="brand"><span class="dot"></span><span class="name">kohlab</span><span class="sub">agent workspaces</span></div>
  <form id="new-form">
    <input id="f-task" placeholder="task description" required />
    <div class="row">
      <input id="f-repo" placeholder="repo path, or GitHub URL to clone" />
      <select id="f-agent">
        <option value="sh">sh</option>
        <option value="omp">omp</option>
        <option value="claude">claude</option>
        <option value="codex">codex</option>
      </select>
    </div>
    <div id="agent-status" class="muted" style="font-size:11px"></div>
    <button type="submit">new workspace</button>
  </form>
  <div id="ws-list"><div class="empty">no workspaces yet</div></div>
</aside>

<main id="main">
  <div id="toolbar">
    <span id="t-id" class="ws-id">—</span>
    <span id="t-status" class="muted"></span>
    <span id="t-path" class="muted"></span>
    <span class="spacer"></span>
    <button id="btn-start" class="btn green">start</button>
    <button id="btn-restart" class="btn">restart</button>
    <button id="btn-share" class="btn" title="copy read-only share link">share</button>
    <button id="btn-stop" class="btn red">stop</button>
    <button id="btn-delete" class="btn red">delete</button>
  </div>
  <div id="tabs">
    <div class="tab" data-view="tree">files</div>
    <div class="tab active" data-view="terminal">terminal</div>
    <div class="tab" data-view="diff">diff</div>
  </div>
  <div id="views">
    <div id="tree-view" class="view">
      <div id="tree-header"><span class="muted">files</span><button id="btn-refresh-tree" class="btn">refresh</button></div>
      <div id="tree-content"></div>
    </div>
    <div id="code-view" class="view">
      <div id="code-header"><span id="code-path"></span></div>
      <pre id="code-content"></pre>
    </div>
    <div id="terminal-view" class="view active"><div id="terminal"></div></div>
    <div id="diff-view" class="view">
      <div id="diff-header"><span class="stat"></span><button id="btn-refresh-diff" class="btn">refresh</button></div>
      <div id="diff-content"></div>
      <div id="commit-bar">
        <input id="commit-msg" placeholder="commit message (defaults to task)" />
        <button id="btn-commit" class="btn primary">commit</button>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const state = { list: [], selected: null, term: null, ws: null, key: new URLSearchParams(location.search).get("key") || localStorage.getItem("kohlab_key") || "" };

// --- access key gate ----------------------------------------------------
// A clean login screen instead of a bare 401. Stores the key after it
// successfully authenticates once.

const gateEl = document.createElement("div");
gateEl.id = "gate";
gateEl.innerHTML = `
  <div class="gate-card">
    <div class="gate-logo"><span class="dot"></span><span class="name">kohlab</span></div>
    <p class="gate-sub">agent workspaces</p>
    <form id="gate-form">
      <input id="gate-key" type="password" placeholder="access key" autocomplete="current-password" autofocus />
      <button type="submit">enter</button>
      <div id="gate-error" class="gate-error"></div>
    </form>
  </div>`;
document.body.prepend(gateEl);

// hide the app until authenticated
function showGate(msg) {
  gateEl.style.display = "flex";
  document.querySelector("#sidebar").style.display = "none";
  document.querySelector("#main").style.display = "none";
  if (msg) {
    const err = gateEl.querySelector("#gate-error");
    err.textContent = msg;
    err.style.display = "block";
  }
}

function hideGate() {
  gateEl.style.display = "none";
  document.querySelector("#sidebar").style.display = "flex";
  document.querySelector("#main").style.display = "flex";
}

async function testKey(k) {
  try {
    const r = await fetch(`/api/workspaces?key=${encodeURIComponent(k)}`);
    return r.status === 200;
  } catch {
    return false;
  }
}

gateEl.querySelector("#gate-form").onsubmit = async (e) => {
  e.preventDefault();
  const k = gateEl.querySelector("#gate-key").value.trim();
  const ok = await testKey(k);
  if (ok) {
    state.key = k;
    localStorage.setItem("kohlab_key", k);
    hideGate();
    boot();
  } else {
    gateEl.querySelector("#gate-error").textContent = "wrong key — try again";
  }
};

const api = async (path, opts) => {
  const sep = path.includes("?") ? "&" : "?";
  const url = state.key ? `${path}${sep}key=${encodeURIComponent(state.key)}` : path;
  const r = await fetch(url, { ...opts, headers: { ...(opts?.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) {
    // key rejected (server restarted with new key) → back to the gate
    localStorage.removeItem("kohlab_key");
    state.key = "";
    showGate("access key changed — enter the new one");
    throw new Error("unauthorized");
  }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};

// wrap the original boot calls behind authentication
let booted = false;
function boot() {
  if (booted) return;
  booted = true;
  refresh();
  setInterval(refresh, 5000);
  listenForDone();
  loadAgentStatus();
}

// entry: valid stored/URL key → straight in; none → gate
(async () => {
  if (state.key && (await testKey(state.key))) {
    hideGate();
    boot();
  } else {
    localStorage.removeItem("kohlab_key");
    showGate();
  }
})();

function toast(msg, ms = 2500) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), ms);
}

// --- sidebar list -------------------------------------------------------

async function refresh() {
  try {
    state.list = await api("/api/workspaces");
  } catch (e) {
    toast("failed to load: " + e.message);
    return;
  }
  const list = $("#ws-list");
  if (state.list.length === 0) {
    list.innerHTML = '<div class="empty">no workspaces yet</div>';
    return;
  }
  list.innerHTML = "";
  for (const w of state.list) {
    const el = document.createElement("div");
    el.className = "ws" + (state.selected === w.id ? " active" : "");
    el.innerHTML = `
      <div class="top"><span class="status ${w.running ? "run" : "stopped"}"></span><span class="id">${w.id}</span></div>
      <div class="meta"><span class="task">${esc(w.task)}</span><span>${w.agent}</span><span>${w.running ? "running" : "stopped"}</span></div>`;
    el.onclick = () => select(w.id);
    list.appendChild(el);
  }
  if (!state.list.find((w) => w.id === state.selected)) select(state.list[0].id);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function select(id) {
  state.selected = id;
  const w = state.list.find((x) => x.id === id);
  if (!w) return;
  $("#t-id").textContent = w.id;
  $("#t-status").textContent = w.running ? "● running" : "○ stopped";
  $("#t-path").textContent = w.path;
  $("#btn-start").disabled = w.running;
  $("#btn-stop").disabled = !w.running;
  renderListActive();
  attachTerminal(id);
  refreshDiff(id);
}

function renderListActive() {
  for (const el of $("#ws-list").children) {
    el.classList.toggle("active", el.querySelector(".id").textContent === state.selected);
  }
}

// --- actions ------------------------------------------------------------

async function act(action, extra) {
  if (!state.selected) return;
  try {
    await api(`/api/workspaces/${state.selected}/${action}`, {
      method: "POST",
      body: extra ? JSON.stringify(extra) : undefined,
    });
    toast(`${action} ${state.selected}`);
    await refresh();
  } catch (e) {
    toast(e.message);
  }
}

$("#btn-start").onclick = () => act("start");
$("#btn-stop").onclick = () => act("stop");
$("#btn-restart").onclick = () => act("restart");
$("#btn-share").onclick = async () => {
  if (!state.selected) return;
  try {
    const res = await api(`/api/workspaces/${state.selected}/share`, { method: "POST" });
    const link = `${location.origin}/?share=${res.share}`;
    await navigator.clipboard.writeText(link).catch(() => {});
    toast("share link copied (read-only)");
  } catch (e) {
    toast("share: " + e.message);
  }
};
$("#btn-delete").onclick = async () => {
  if (!confirm("delete workspace " + state.selected + "? worktree will be removed")) return;
  await act("delete");
  state.selected = null;
};
$("#btn-refresh-diff").onclick = () => refreshDiff(state.selected);
$("#btn-commit").onclick = async () => {
  const msg = $("#commit-msg").value.trim();
  await act("commit", { message: msg });
  $("#commit-msg").value = "";
  toast("committed " + state.selected);
  refreshDiff(state.selected);
};

// --- terminal (xterm + ws) ----------------------------------------------

function attachTerminal(id) {
  if (!state.term) {
    const t = new Terminal({
      cursorBlink: true,
      fontSize: 13,
      fontFamily: 'ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace',
      theme: { background: "#000", foreground: "#d0d7e5", cursor: "#4f8cff" },
      scrollback: 5000,
    });
    t.open(document.getElementById("terminal"));
    state.term = t;
  }
  if (state.ws) state.ws.close();
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const keyq = state.key ? `?key=${encodeURIComponent(state.key)}` : "";
  const ws = new WebSocket(`${proto}//${location.host}${keyq}`);
  ws.onopen = () => ws.send(JSON.stringify({ type: "attach", id }));
  ws.onmessage = (ev) => state.term.write(ev.data);
  ws.onclose = () => state.term.write("\r\n\x1b[31m[disconnected — server or session ended]\x1b[0m\r\n");
  state.ws = ws;
  state.term.focus();
  state.term.onData((d) => {
    if (ws.readyState === WebSocket.OPEN) ws.send(d);
  });
}

// --- diff ---------------------------------------------------------------

async function refreshDiff(id) {
  if (!id) return;
  try {
    const files = await api(`/api/workspaces/${id}/diff`);
    const content = $("#diff-content");
    const stat = $("#diff-header .stat");
    if (!files.length) { stat.textContent = "(clean)"; content.innerHTML = '<div class="diff-line clean">no changes</div>'; return; }
    stat.textContent = files[0].name.split("\n")[0];
    const diff = files[0].diff;
    if (!diff.trim()) { content.innerHTML = '<div class="diff-line clean">no changes</div>'; return; }
    let html = "";
    for (const line of diff.split("\n")) {
      let cls = "";
      if (line.startsWith("+++") || line.startsWith("---")) cls = "meta";
      else if (line.startsWith("@@")) cls = "hunk";
      else if (line.startsWith("+")) cls = "add";
      else if (line.startsWith("-")) cls = "del";
      html += `<div class="diff-line ${cls}"><span class="ln"></span><span>${esc(line) || "&nbsp;"}</span></div>`;
    }
    content.innerHTML = html;
  } catch (e) {
    toast("diff: " + e.message);
  }
}

// --- agent status + clone support --------------------------------------

async function loadAgentStatus() {
  try {
    const st = await api("/api/agents-status");
    const parts = Object.entries(st)
      .filter(([, ok]) => ok)
      .map(([n]) => n);
    const box = $("#agent-status");
    if (parts.length === 0) {
      box.textContent = "no agents installed yet — install omp, claude, codex…";
    } else {
      box.textContent = `installed: ${parts.join(", ")}`;
    }
  } catch {
    // ignore — non-blocking
  }
}



// --- tabs ---------------------------------------------------------------

for (const tab of document.querySelectorAll(".tab")) {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === tab));
    document.querySelectorAll(".view").forEach((v) => v.classList.toggle("active", v.id === tab.dataset.view + "-view"));
  };
}

// --- new workspace ------------------------------------------------------

$("#new-form").onsubmit = async (e) => {
  e.preventDefault();
  const task = $("#f-task").value.trim();
  if (!task) return;
  const repo = $("#f-repo").value.trim();
  const agent = $("#f-agent").value;
  const isUrl = /^https?:\/\//.test(repo);
  try {
    const w = await api(isUrl ? "/api/clone" : "/api/workspaces", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(isUrl ? { url: repo, task, agent } : { repo: repo || undefined, task, agent }),
    });
    $("#f-task").value = "";
    toast("created " + w.id);
    await refresh();
    select(w.id);
  } catch (err) {
    toast("create: " + err.message);
  }
};


// --- completion notifications -------------------------------------------

// listen for workspace.done pushes over the same websocket the terminal uses
function listenForDone() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const keyq = state.key ? `?key=${encodeURIComponent(state.key)}` : "";
  const sock = new WebSocket(`${proto}//${location.host}${keyq}`);

  sock.onmessage = (ev) => {
    let msg;
    try {
      msg = JSON.parse(ev.data);
    } catch {
      return;
    }
    if (msg.type === "workspace.done") {
      toast(`✓ ${msg.agent} finished: ${msg.task}`);
      refresh();
    }
  };
  sock.onclose = () => setTimeout(listenForDone, 3000);
}

// --- file tree + code view ----------------------------------------------

async function loadTree(id) {
  try {
    const tree = await api(`/api/workspaces/${id}/files`);
    const box = $("#tree-content");
    box.innerHTML = "";
    const ul = renderTree(tree, id);
    box.appendChild(ul);
  } catch (e) {
    $("#tree-content").textContent = "failed to load files: " + e.message;
  }
}

function renderTree(nodes, id) {
  const ul = document.createElement("div");
  ul.className = "tree-children";
  for (const n of nodes) {
    const row = document.createElement("div");
    row.className = "tree-item " + n.type;
    if (n.type === "dir") {
      row.innerHTML = `<span class="arrow">▸</span><span class="icon">📁</span><span>${esc(n.name)}</span>`;
      const kids = renderTree(n.children || [], id);
      kids.style.display = "none";
      row.onclick = () => {
        const open = kids.style.display !== "none";
        kids.style.display = open ? "none" : "block";
        row.querySelector(".arrow").textContent = open ? "▸" : "▾";
      };
      ul.appendChild(row);
      ul.appendChild(kids);
    } else {
      row.innerHTML = `<span class="arrow"></span><span class="icon">📄</span><span>${esc(n.name)}</span>`;
      row.onclick = () => openFile(id, n.name);
      ul.appendChild(row);
    }
  }
  return ul;
}

async function openFile(id, name) {
  try {
    const f = await api(`/api/workspaces/${id}/file?path=${encodeURIComponent(name)}`);
    $("#code-path").textContent = f.path;
    $("#code-content").textContent = f.content;
    showView("code");
  } catch (e) {
    toast("open file: " + e.message);
  }
}

function showView(name) {
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.view === name));
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("active", v.id === name + "-view"));
}

$("#btn-refresh-tree").onclick = () => loadTree(state.selected);

// hook tree refresh into workspace selection
const origSelect = select;
select = function (id) {
  origSelect(id);
  loadTree(id);
};

// --- keyboard shortcuts --------------------------------------------------

document.addEventListener("keydown", (e) => {
  // ignore when typing in an input
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT")) return;
  // ctrl/⌘ + 1..3: jump to files/terminal/diff
  if ((e.ctrlKey || e.metaKey) && e.key >= "1" && e.key <= "3") {
    const names = ["tree", "terminal", "diff"];
    showView(names[Number(e.key) - 1]);
    e.preventDefault();
  }
  // n: new workspace (focus the task input)
  if (e.key === "n" && !e.ctrlKey && !e.metaKey && !e.altKey) {
    $("#f-task").focus();
    e.preventDefault();
  }
  // r: refresh
  if (e.key === "r" && !e.ctrlKey && !e.metaKey) {
    refresh();
    if (state.selected) loadTree(state.selected);
  }
});
