<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover is REQUIRED for env(safe-area-inset-*) to be non-zero;
     without it the drawer and topbar sit under the notch/home indicator. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<!-- Declared before any stylesheet so the UA paints the right canvas immediately
     and there is no flash on load. Mirrors the OS setting the :root colour-scheme follows. -->
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090a0c" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<!-- Installable: iPhone only delivers Web Push to a site added to the Home Screen. -->
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Kohlab" />
<title>kohlab</title>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
