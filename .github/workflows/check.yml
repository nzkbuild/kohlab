name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: cd web && bun install --frozen-lockfile && bun run build
      - run: sudo apt-get install -y -q acl
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      # As root, like the box it protects: the isolation and agent-user checks need it.
      - run: sudo -E env "PATH=$PATH" HOME=$HOME node scripts/check-all.mjs
